name: Plakat Scraping

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: scrape-google-sheet
  cancel-in-progress: false

env:
  PLAKAT_SCRAPER_ZEPTOMAIL_API_KEY: ${{ secrets.PLAKAT_SCRAPER_ZEPTOMAIL_API_KEY }}
  ENV: production

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Restore state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: plakat-scraper/.state.json
          # Cache keys are immutable; use a unique key per run and restore the
          # newest previous state via the prefix.
          key: scraper-state-v2-${{ forgejo.run_id }}
          restore-keys: |
            scraper-state-v2-

      - name: Run scraper
        working-directory: plakat-scraper
        run: deno task start

      - name: Save state
        uses: actions/cache/save@v4
        with:
          path: plakat-scraper/.state.json
          key: scraper-state-v2-${{ forgejo.run_id }}
