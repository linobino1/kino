apiVersion: apps/v1
kind: Deployment
metadata:
  name: kino-frontend
  namespace: kino-im-blauen-salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kino-frontend
  template:
    metadata:
      labels:
        app: kino-frontend
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: kino-frontend
          image: git.leohilsheimer.com/leo/kino-im-blauen-salon-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: kino-secrets
            - configMapRef:
                name: kino-env
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
